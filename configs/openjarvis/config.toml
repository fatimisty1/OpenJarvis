# OpenJarvis configuration — Groq Cloud Engine Setup

# ═══════════════════════════════════════════════════════════════
# PILLAR 1: Intelligence — The Model
# ═══════════════════════════════════════════════════════════════
[intelligence]
default_model = "llama-3.3-70b-versatile"   # Groq free model ID
fallback_model = "llama-3.1-8b-instant"     # Fallback model
preferred_engine = "openai"               # Uses OpenAI-compatible cloud routing
provider = "cloud"                        # Running via cloud API instead of local
quantization = "none"                     
# Generation defaults
temperature = 0.0                         # Deterministic
max_tokens = 2048                         
top_p = 0.9
top_k = 40
repetition_penalty = 1.0

# ═══════════════════════════════════════════════════════════════
# PILLAR 2: Agent — The Agentic Harness
# ═══════════════════════════════════════════════════════════════
[agent]
default_agent = "native_openhands"        # CodeAct-style agent
max_turns = 10                            # Up to 10 tool-calling turns
tools = "code_interpreter,web_search,file_read,calculator,think"
objective = "Answer questions accurately using available tools"
context_from_memory = false               

# ═══════════════════════════════════════════════════════════════
# PILLAR 3: Tools — MCP Interface
# ═══════════════════════════════════════════════════════════════
[tools.storage]
default_backend = "sqlite"
db_path = "~/.openjarvis/memory.db"

[tools.mcp]
enabled = true

# ═══════════════════════════════════════════════════════════════
# PILLAR 4: Engine — The Inference Runtime
# ═══════════════════════════════════════════════════════════════
[engine]
default = "openai"                        # Points to the OpenAI-compatible cloud block below

[engine.openai]
host = "https://api.groq.com/openai/v1"   # Groq API endpoint
api_key = "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"        # ⬅️ PASTE YOUR GROQ API KEY HERE

[engine.vllm]
host = "http://localhost:8001"            

[engine.ollama]
host = "http://localhost:11434"

[engine.sglang]
host = "http://localhost:30000"

[engine.llamacpp]
host = "http://localhost:8080"

[engine.exo]
host = "http://localhost:52415"

[engine.nexa]
host = "http://localhost:18181"

[engine.uzu]
host = "http://localhost:8080"

[engine.apple_fm]
host = "http://localhost:8079"              

[engine.afm]
sampling = "greedy"                           

# ═══════════════════════════════════════════════════════════════
# PILLAR 5: Learning — Improvement Methodologies
# ═══════════════════════════════════════════════════════════════
[learning]
enabled = false                           

[learning.routing]
policy = "heuristic"

[learning.intelligence]
policy = "none"

[learning.agent]
policy = "none"

[learning.metrics]
accuracy_weight = 0.6
latency_weight = 0.2
cost_weight = 0.1
efficiency_weight = 0.1

# ═══════════════════════════════════════════════════════════════
# Supporting config
# ═══════════════════════════════════════════════════════════════
[telemetry]
enabled = true
db_path = "~/.openjarvis/telemetry.db"
gpu_metrics = false
gpu_poll_interval_ms = 50
energy_vendor = ""                       
warmup_samples = 0                       
steady_state_window = 5                  
steady_state_threshold = 0.05            

[traces]
enabled = true                            
db_path = "~/.openjarvis/traces.db"

[server]
host = "127.0.0.1"
port = 8000
agent = "native_openhands"
